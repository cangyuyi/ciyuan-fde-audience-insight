[project]
name = "audience-insight-agent"
version = "0.2.0"
description = "Evidence-grounded audience insight agent with durable LangGraph orchestration"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]>=0.34,<1",
  "langgraph==1.2.19",
  "langgraph-checkpoint-postgres==3.2.0",
  "openai==3.45.0",
  "asyncpg>=0.31,<1",
  "psycopg[binary]==3.3.7",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.0,<2",
  "openpyxl==3.1.5",
  "python-docx==1.2.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<1",
]

[project.scripts]
audience-agent = "audience_agent.cli:main"
audience-raw-import = "audience_agent.raw_ingest:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audience_agent"]
